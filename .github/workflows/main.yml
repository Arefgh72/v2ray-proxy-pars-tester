# .github/workflows/main.yml

name: Fetch, Test and Merge Proxies CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools (Sing-box & Hysteria)
        run: |
          # Install Sing-box
          LATEST_SING_BOX=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          DOWNLOAD_URL_SB="https://github.com/SagerNet/sing-box/releases/download/${LATEST_SING_BOX}/sing-box-${LATEST_SING_BOX#v}-linux-amd64.tar.gz"
          curl -L -o sing-box.tar.gz "$DOWNLOAD_URL_SB"
          tar -xzf sing-box.tar.gz && mv sing-box-*/sing-box . && chmod +x ./sing-box
          # Install Hysteria Client
          LATEST_HYSTERIA=$(curl -s "https://api.github.com/repos/apernet/hysteria/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          DOWNLOAD_URL_HY="https://github.com/apernet/hysteria/releases/download/${LATEST_HYSTERIA}/hysteria-linux-amd64"
          curl -L -o hysteria-client "$DOWNLOAD_URL_HY" && chmod +x ./hysteria-client

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run All Scripts
        # ✅ اجرای مستقیم اسکریپت‌ها بدون -m، دقیقاً مطابق با منطق فایل شما
        run: |
          python scripts/01_fetch_hysteria.py
          python scripts/01_fetch_proxies.py
          python scripts/02_test_hysteria.py
          python scripts/02_test_proxies.py
          python scripts/03_merge_and_sort.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull
          git add output/
          if ! git diff --staged --quiet; then
            git commit -m "✅ Auto-Update: Proxies refreshed at $(date -u)"
            git push
          else
            echo "No changes to commit."
          fi
